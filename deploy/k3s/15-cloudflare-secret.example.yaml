# Cloudflare API token for the cert-manager DNS-01 solver.
#
# DO NOT commit a real token. Create the Secret imperatively instead (keeps it out of git):
#
#   kubectl create secret generic cloudflare-api-token \
#     -n cert-manager \
#     --from-literal=api-token=<YOUR_CLOUDFLARE_API_TOKEN>
#
# Token scope: ideally a token limited to the know-me.tools zone with
#   Zone - Zone - Read   AND   Zone - DNS - Edit
# (The current "edit all zones" token works but is broader than necessary — mint a scoped one
# when convenient and rotate.)
#
# This file is only a placeholder to document the expected Secret shape; apply the kubectl
# command above rather than this manifest.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
type: Opaque
stringData:
  api-token: "REPLACE_ME__use_kubectl_create_secret_instead"
