[package]
name = "jesus-twin-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The jesus-twin binary: serve / skill <name> / chat."

[[bin]]
name = "jesus-twin"
path = "src/main.rs"

[features]
# Serve the real Gemma 4 via mistral.rs instead of the deterministic MockEngine. Off by
# default (keeps normal builds fast; avoids the candle-coupling compile). Forwards to the
# inference crate's feature. Build/run with `--features mistralrs`.
default = []
# `dep:async-trait` is only needed by the embedder adapter compiled under this feature.
mistralrs = ["jesus-twin-inference/mistralrs", "dep:async-trait"]
# NVIDIA CUDA acceleration (implies mistralrs). The release build flag on a CUDA host:
# `cargo build --release --features cuda`. Requires the CUDA toolkit (nvcc).
cuda = ["mistralrs", "jesus-twin-inference/cuda"]
# Flash Attention 2 kernels (implies cuda).
flash-attn = ["cuda", "jesus-twin-inference/flash-attn"]
# cuDNN acceleration (implies cuda).
cudnn = ["cuda", "jesus-twin-inference/cudnn"]

[dependencies]
jesus-twin-core.workspace = true
jesus-twin-api.workspace = true
jesus-twin-store.workspace = true
jesus-twin-inference.workspace = true
jesus-twin-admission.workspace = true
jesus-twin-skills.workspace = true

clap.workspace = true
tokio.workspace = true
# Only used by the `mistralrs`-gated embedder adapter (see `mistralrs` feature).
async-trait = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
uuid.workspace = true
serde_json.workspace = true
